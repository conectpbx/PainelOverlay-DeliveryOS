<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Painel — ao vivo</title>
<style>
  :root{
    --bg:#0B0E11; --panel:#12161B; --text:#F2F0EA; --muted:#6B7480;
    --amber:#FFB020; --green:#3FDB8E; --red:#FF5D5D; --hairline:#20252C;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;}
  body{display:flex;flex-direction:column;min-height:100vh;}
  .statusbar{display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#454C56;margin-right:7px;}
  .statusbar.live .dot{background:var(--green);box-shadow:0 0 8px var(--green);}
  .statusbar.err .dot{background:var(--red);box-shadow:0 0 8px var(--red);}
  .gauge-wrap{flex:1;display:flex;align-items:center;justify-content:center;}
  .num{font-size:clamp(70px,22vw,140px);font-weight:700;font-variant-numeric:tabular-nums;}
  .unit{text-align:center;font-size:13px;letter-spacing:.22em;color:var(--muted);margin-top:-10px;}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hairline);
    border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);}
  .stat{background:var(--panel);padding:18px 20px;}
  .stat .label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .stat .val{font-size:24px;font-weight:600;margin-top:4px;}
  .stat.trip .val{color:var(--green);}
  .foot{text-align:center;font-size:10px;color:#454C56;padding:14px;}
</style>
</head>
<body>
  <div class="statusbar" id="statusbar">
    <span><span class="dot"></span><span id="statusTxt">Conectando…</span></span>
    <span id="accTxt">—</span>
  </div>
  <div class="gauge-wrap">
    <div>
      <div class="num" id="speedNum">0</div>
      <div class="unit">km/h</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat trip">
      <div class="label">Trajeto</div>
      <div class="val" id="tripVal">0,00 km</div>
    </div>
    <div class="stat">
      <div class="label">Total</div>
      <div class="val" id="totalVal">0,00 km</div>
    </div>
  </div>
  <div class="foot">painel do carro • dados ao vivo do celular na rede local</div>
<script>
const statusbar=document.getElementById('statusbar');
const statusTxt=document.getElementById('statusTxt');
const accTxt=document.getElementById('accTxt');
const speedNum=document.getElementById('speedNum');
const tripVal=document.getElementById('tripVal');
const totalVal=document.getElementById('totalVal');

function fmt(km){
  return km.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}

async function poll(){
  try{
    const res=await fetch('/status',{cache:'no-store'});
    if(!res.ok) throw new Error('bad status');
    const d=await res.json();
    statusbar.classList.remove('err');
    statusbar.classList.add('live');
    statusTxt.textContent='Ao vivo';
    accTxt.textContent=d.accuracy_m>=0?'±'+Math.round(d.accuracy_m)+'m':'—';
    speedNum.textContent=Math.round(d.speed_kmh);
    tripVal.textContent=fmt(d.trip_km)+' km';
    totalVal.textContent=fmt(d.total_km)+' km';
  }catch(e){
    statusbar.classList.remove('live');
    statusbar.classList.add('err');
    statusTxt.textContent='Sem conexão com o app';
  }
}
poll();
setInterval(poll,1000);
</script>
</body>
</html>
